<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ossetian VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0a1224;
  --card: rgba(255,244,225,.05);
  --line: rgba(240,214,160,.16);
  --text: #f6efe2;
  --muted: #a7b0bf;
  --gold: #e9b949;
  --gold-soft: #f4d98c;
  --red: #d8453a;
  --river: #5fd0c6;
  --river-deep: #2a8f9a;
  --gold-hi: #f2d98f; --gold-lo: #dea736;
  --gold-rgb: 233,185,73; --river-rgb: 95,208,198; --red-rgb: 216,69,58;
  --bg1: #1b2a4d; --bg2: #101a33; --panel-rgb: 16,26,51; --deep-rgb: 10,18,36;
  --dist: 48px;
  --radius: 26px;
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
body { background: transparent; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(90% 38% at 50% 0%, rgba(var(--gold-rgb),.16) 0%, transparent 70%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 34%, var(--bg) 70%); }
#app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px 120px; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input { font: inherit; }
.hidden { display: none !important; }

/* верхняя панель */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; position: relative; z-index: 2; }
.avatar { width: 48px; height: 48px; border-radius: 16px; background: linear-gradient(135deg,#3a3f5e,#1d2440);
  border: 1px solid rgba(var(--gold-rgb),.45); display: grid; place-items: center; font-weight: 800; font-size: 20px; flex: none; font-family: var(--serif); color: var(--gold-soft); }
.avatar img { width: 100%; height: 100%; border-radius: 15px; object-fit: cover; display: block; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 15px; border-radius: 16px;
  background: rgba(var(--deep-rgb),.72); border: 1px solid var(--line);
  font-size: 15.5px; color: #d3d9e4; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px currentColor; color: var(--red); flex: none; }
.dot.ok { background: var(--river); color: var(--river); }
.status-pill { flex: 1; min-width: 0; justify-content: flex-start; overflow: hidden; text-overflow: ellipsis; }

/* баннер с горами */
.banner { position: relative; margin: 0 -16px 8px; height: 238px; overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg,#000 78%,transparent); mask-image: linear-gradient(180deg,#000 78%,transparent); }
.banner svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.banner .title { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; text-shadow: 0 2px 18px rgba(5,10,24,.85); }
.eyebrow { font-family: var(--serif); letter-spacing: 6px; text-transform: uppercase; font-size: 13px; color: var(--gold-soft); margin-bottom: 4px; }
.brand { font-family: var(--serif); font-size: 40px; font-weight: 700; letter-spacing: -.5px; line-height: 1.05; }
.brand b { color: var(--gold); }
.orn { height: 14px; margin: 0 4px 16px; opacity: .85;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='14' viewBox='0 0 28 14'><path d='M14 1.5 22 7 14 12.5 6 7z' fill='none' stroke='%23e9b949' stroke-width='1.2'/><path d='M14 4.6 17.2 7 14 9.4 10.8 7z' fill='%23d8453a'/><path d='M0 7h4M24 7h4' stroke='%23e9b949' stroke-width='1.2'/></svg>") repeat-x center; }

/* карточки */
.glass { background: linear-gradient(165deg, rgba(255,240,215,.09), rgba(255,240,215,.03)), rgba(var(--panel-rgb),.55);
  border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 18px 40px -22px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,240,215,.08); }
.hero { padding: 24px 22px 22px; text-align: center; position: relative; }
.hero::before { content: ""; position: absolute; left: 26px; right: 26px; top: -1px; height: 3px; border-radius: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--red), var(--gold), transparent); opacity: .9; }
.hero-icon { width: 74px; height: 74px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 35%, rgba(var(--gold-rgb),.22), rgba(var(--gold-rgb),.05)); border: 1px solid rgba(var(--gold-rgb),.45); color: var(--gold); }
.hero-icon.ok { color: var(--river); border-color: rgba(var(--river-rgb),.5); background: radial-gradient(circle at 50% 35%, rgba(var(--river-rgb),.22), rgba(var(--river-rgb),.04)); }
.hero-icon.bad { color: #ff8f84; border-color: rgba(var(--red-rgb),.5); background: radial-gradient(circle at 50% 35%, rgba(var(--red-rgb),.22), rgba(var(--red-rgb),.04)); }
.hero-icon svg { width: 36px; height: 36px; }
.hero h1 { margin: 0 0 10px; font-family: var(--serif); font-size: 30px; line-height: 1.12; letter-spacing: -.3px; font-weight: 700; }
.hero p { margin: 0 auto 20px; color: var(--muted); font-size: 17px; line-height: 1.45; max-width: 420px; }
.btn { display: block; width: 100%; padding: 17px 16px; border-radius: 20px; font-size: 20px; font-weight: 700; text-align: center; }
.btn-main { background: linear-gradient(180deg,var(--gold-hi),var(--gold-lo)); color: #2b1c02;
  box-shadow: 0 10px 26px -10px rgba(var(--gold-rgb),.7), inset 0 1px 0 rgba(255,255,255,.6); }
.btn-ghost { background: rgba(255,255,255,.03); border: 1px solid rgba(var(--river-rgb),.5); color: var(--river);
  display: flex; gap: 12px; align-items: center; justify-content: center; }
.btn svg { width: 24px; height: 24px; flex: none; }
.btn:active { transform: scale(.985); }
.btn[disabled] { opacity: .55; }
.stack > * + * { margin-top: 12px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.mini { padding: 17px 18px 15px; border-radius: 24px; min-height: 104px; }
.mini .k { color: var(--muted); font-size: 16px; }
.mini .v { margin-top: 12px; font-family: var(--serif); font-size: 27px; font-weight: 700; letter-spacing: -.3px; }
.mini .s { color: var(--river); font-size: 14.5px; margin-top: 4px; }

.row { display: flex; align-items: center; gap: 14px; padding: 15px 18px; border-radius: 22px; margin-top: 12px; text-align: left; width: 100%; }
.row .ic { width: 44px; height: 44px; border-radius: 14px; background: rgba(var(--gold-rgb),.10); display: grid; place-items: center; color: var(--gold); flex: none; border: 1px solid rgba(var(--gold-rgb),.25); }
.row .ic svg { width: 22px; height: 22px; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-size: 17.5px; }
.row .t span { color: var(--muted); font-size: 14px; }
.row .chev { color: var(--muted); }

.h2 { font-family: var(--serif); font-size: 28px; font-weight: 700; letter-spacing: -.3px; margin: 4px 2px 12px; }
.sub { color: var(--muted); margin: -4px 2px 16px; font-size: 16px; line-height: 1.4; }
.pre { white-space: pre-wrap; line-height: 1.5; font-size: 16px; color: #e3e0d8; padding: 20px; border-radius: 22px; }

/* тарифы */
.tariff { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 17px 20px;
  border-radius: 22px; margin-bottom: 12px; text-align: left; border: 1.5px solid var(--line); background: var(--card); }
.tariff.sel { border-color: var(--gold); background: rgba(var(--gold-rgb),.10); box-shadow: 0 0 0 4px rgba(var(--gold-rgb),.10); }
.tariff .n { font-family: var(--serif); font-size: 21px; font-weight: 700; }
.tariff .m { color: var(--muted); font-size: 14px; margin-top: 3px; }
.tariff .p { text-align: right; font-weight: 800; font-size: 22px; }
.tariff .p small { display: block; color: var(--muted); font-size: 14px; font-weight: 500; }
.tariff .old { text-decoration: line-through; color: var(--muted); font-weight: 500; font-size: 14px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 14px; background: rgba(var(--gold-rgb),.12); border: 1px solid rgba(var(--gold-rgb),.3); font-size: 24px; font-weight: 700; color: var(--gold-soft); }
.stepper button[disabled] { opacity: .35; }
.stepper output { min-width: 34px; text-align: center; font-size: 22px; font-weight: 800; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 4px 14px; color: var(--muted); font-size: 17px; }
.total b { color: var(--text); font-family: var(--serif); font-size: 28px; }

.dev { display: flex; align-items: center; gap: 14px; width: 100%; padding: 15px 18px; border-radius: 20px; margin-bottom: 10px; text-align: left; }
.dev .t b { display: block; font-size: 17.5px; }
.dev .t span { color: var(--muted); font-size: 14px; }
.dev .t { flex: 1; }
.dev .chev { color: var(--muted); }
.field { display: flex; gap: 10px; margin-top: 2px; }
.field input { flex: 1; min-width: 0; padding: 15px 18px; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.28); color: var(--text); font-size: 18px; text-transform: uppercase; outline: none; }
.field input:focus { border-color: var(--gold); }
.field .btn { width: auto; padding: 0 22px; font-size: 18px; border-radius: 16px; }
.keybox { word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5;
  padding: 14px; border-radius: 14px; background: rgba(0,0,0,.38); border: 1px solid var(--line); max-height: 160px; overflow: auto; color: #e6dfc9; }

.sheet-bg { position: fixed; inset: 0; background: rgba(3,7,18,.78); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
.sheet { width: 100%; max-width: 560px; padding: 22px 18px calc(env(safe-area-inset-bottom) + 20px); border-radius: 28px 28px 0 0;
  background: linear-gradient(180deg,var(--bg1),var(--bg2)); border: 1px solid var(--line); border-bottom: 0; max-height: 86vh; overflow: auto; position: relative; }
.sheet::before { content: ""; position: absolute; left: 30px; right: 30px; top: -1px; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), var(--red), var(--gold), transparent); }
.sheet h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 25px; }
.sheet p { color: var(--muted); margin: 0 0 14px; line-height: 1.45; font-size: 15.5px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 112px); transform: translateX(-50%); z-index: 40;
  background: #172342; border: 1px solid rgba(var(--gold-rgb),.4); padding: 14px 20px; border-radius: 16px; font-size: 16px; max-width: 88vw; text-align: center;
  box-shadow: 0 14px 40px rgba(0,0,0,.5); }

.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 14px);
  width: calc(100% - 28px); max-width: 532px; display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; padding: 8px;
  border-radius: 30px; background: rgba(var(--deep-rgb),.95); border: 1px solid var(--line);
  z-index: 20; box-shadow: 0 18px 40px -14px rgba(0,0,0,.85); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px 8px; border-radius: 22px; color: var(--muted); font-size: 13.5px; }
.tab svg { width: 26px; height: 26px; }
.tab.on { color: var(--gold); background: rgba(var(--gold-rgb),.13); }
.skeleton { height: 280px; border-radius: var(--radius); background: linear-gradient(110deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.10) 50%,rgba(255,255,255,.04) 70%); background-size: 200% 100%; animation: sh 1.3s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }
@keyframes flow { to { stroke-dashoffset: -40; } }
.flow { animation: flow 2.4s steps(24) infinite; }
@media (prefers-reduced-motion: reduce) { .flow, .skeleton { animation: none; } }

/* способ оплаты */
.pm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 14px; }
.pm button { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 16px; border-radius: 20px;
  border: 1.5px solid var(--line); background: var(--card); text-align: left; transition: border-color .25s, background .25s, box-shadow .25s, transform .15s; }
.pm button b { font-size: 17px; }
.pm button span { color: var(--muted); font-size: 13.5px; }
.pm button.sel { border-color: var(--gold); background: rgba(var(--gold-rgb),.10); box-shadow: 0 0 0 4px rgba(var(--gold-rgb),.10); }
.pm button.off { opacity: .6; }
.pm button:active { transform: scale(.97); }
.pm .soon { position: absolute; top: 10px; right: 10px; font-size: 11px; letter-spacing: .6px; text-transform: uppercase; padding: 3px 8px; border-radius: 99px;
  background: rgba(var(--river-rgb),.14); color: var(--river); border: 1px solid rgba(var(--river-rgb),.4); }

/* анимации */
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.96); } 55% { transform: scale(1.025); } 100% { transform: scale(1); } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(var(--gold-rgb),.40); } 100% { box-shadow: 0 0 0 22px rgba(var(--gold-rgb),0); } }
@keyframes ringOk { 0% { box-shadow: 0 0 0 0 rgba(var(--river-rgb),.40); } 100% { box-shadow: 0 0 0 22px rgba(var(--river-rgb),0); } }
@keyframes sweep { 0% { transform: translateX(-120%) skewX(-18deg); } 60%, 100% { transform: translateX(260%) skewX(-18deg); } }
@keyframes bump { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-5px) scale(1.14); } 100% { transform: none; } }
@keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes glow { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
.enter > * { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.enter > *:nth-child(2) { animation-delay: .06s; } .enter > *:nth-child(3) { animation-delay: .12s; }
.enter > *:nth-child(4) { animation-delay: .18s; } .enter > *:nth-child(5) { animation-delay: .24s; }
.enter > *:nth-child(6) { animation-delay: .30s; } .enter > *:nth-child(n+7) { animation-delay: .36s; }
.pop { animation: pop .35s cubic-bezier(.2,.8,.2,1); }
.sheet-bg { animation: fadeIn .22s ease-out; }
.sheet { animation: sheetUp .32s cubic-bezier(.2,.9,.2,1); }
.toast { animation: toastIn .28s cubic-bezier(.2,.9,.2,1); }
.hero-icon { animation: ring 2.6s ease-out infinite, drift 5s ease-in-out infinite; }
.hero-icon.ok { animation: ringOk 2.6s ease-out infinite, drift 5s ease-in-out infinite; }
.btn-main { position: relative; overflow: hidden; transition: transform .15s, box-shadow .25s; }
.btn-main::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 38%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: sweep 3.8s ease-in-out infinite; pointer-events: none; }
.btn-main[disabled]::after { display: none; }
.tariff, .row, .dev, .mini { transition: transform .15s, border-color .25s, background .25s; }
.tariff:active, .row:active, .dev:active { transform: scale(.985); }
.hero::before { animation: glow 3.4s ease-in-out infinite; }
.tab { transition: color .25s, background .25s; }
.tab.bump svg { animation: bump .45s cubic-bezier(.2,.8,.2,1); }
.total b { display: inline-block; }
.total b.tick { animation: pop .3s ease-out; }

/* ---------- вступительная заставка ---------- */
.introing #app, .introing .tabs { visibility: hidden; }
.intro { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #050a1a; cursor: pointer;
  animation: introIn .5s ease-out both; }
.intro.out { animation: introOut .7s cubic-bezier(.4,0,.2,1) forwards; pointer-events: none; }
@keyframes introIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes introOut { to { opacity: 0; transform: scale(1.08); } }
.intro.out * { animation-play-state: paused !important; }
.intro { will-change: transform, opacity; }
.intro svg.world { position: absolute; inset: 0; width: 100%; height: 100%; }
.intro svg.world * { transform-box: fill-box; }
.i-sun { animation: iSun 2.6s cubic-bezier(.2,.7,.2,1) .3s both; transform-origin: 50% 50%; }
.i-far { animation: iRise 1.6s cubic-bezier(.2,.8,.2,1) .5s both; }
.i-peak { animation: iRise 1.9s cubic-bezier(.2,.8,.2,1) .8s both; }
.i-snow { animation: fadeIn 1s ease-out 2.2s both; }
.i-front { animation: iRise 1.6s cubic-bezier(.2,.8,.2,1) 1.1s both; }
.i-trees { animation: iRise 1.4s cubic-bezier(.2,.8,.2,1) 1.4s both; }
.i-river { stroke-dasharray: 1; stroke-dashoffset: 1; animation: iDraw 1.6s ease-in-out 1.8s forwards; }
.i-flow { opacity: 0; animation: flow 2.4s steps(24) infinite, fadeIn .8s ease-out 3.2s forwards; }
.i-base { animation: fadeIn .6s ease-out 1.2s both; }
@keyframes iRise { from { opacity: 0; transform: translateY(110px) scale(1.04); } to { opacity: 1; transform: none; } }
@keyframes iSun { from { opacity: 0; transform: translateY(150px) scale(.5); } 40% { opacity: 1; } to { opacity: 1; transform: translateY(0) scale(1.18); } }
@keyframes iDraw { to { stroke-dashoffset: 0; } }
.i-star { animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
.i-glint { transform-box: fill-box; transform-origin: 50% 50%; animation: glint 2.8s ease-in-out 2.9s infinite both; opacity: 0; }
@keyframes glint { 0%, 100% { opacity: 0; transform: scale(.2); } 40% { opacity: 1; transform: scale(1); } 60% { opacity: 1; transform: scale(.9); } 85% { opacity: 0; transform: scale(.3); } }
.aurora { position: absolute; left: -30%; width: 160%; height: 46%; opacity: 0; pointer-events: none; will-change: transform; }
.aurora.a1 { top: 4%; background: radial-gradient(60% 60% at 30% 50%, rgba(var(--river-rgb),.55), transparent 70%); animation: aur 9s ease-in-out 1s infinite alternate, fadeIn 2.4s ease-out .6s forwards; }
.aurora.a2 { top: 10%; background: radial-gradient(55% 55% at 70% 50%, rgba(var(--red-rgb),.38), transparent 70%); animation: aur 11s ease-in-out .2s infinite alternate-reverse, fadeIn 2.4s ease-out 1.2s forwards; }
@keyframes aur { from { transform: translateX(-9%) skewX(-6deg) scaleY(.9); } to { transform: translateX(9%) skewX(6deg) scaleY(1.15); } }
.i-title { position: absolute; left: 0; right: 0; top: 17%; text-align: center; padding: 0 16px; pointer-events: none; }
.i-eyebrow { font-family: var(--serif); text-transform: uppercase; font-size: 15px; color: var(--gold-soft); letter-spacing: 0; opacity: 0;
  animation: iEyebrow 1.8s cubic-bezier(.2,.8,.2,1) 1.5s forwards; }
@keyframes iEyebrow { from { opacity: 0; letter-spacing: 0; } to { opacity: 1; letter-spacing: 11px; } }
.i-brand { margin-top: 10px; font-family: var(--serif); font-size: 46px; font-weight: 700; line-height: 1.05; display: flex; justify-content: center; flex-wrap: wrap; }
.i-brand span { display: inline-block; opacity: 0; animation: iLetter .9s cubic-bezier(.2,.8,.2,1) both; text-shadow: 0 4px 30px rgba(5,10,24,.9); }
.i-brand span.gold { color: var(--gold); }
@keyframes iLetter { from { opacity: 0; transform: translateY(26px) scale(.8); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
.i-orn { width: 190px; height: 14px; margin: 16px auto 0; transform: scaleX(0); opacity: 0; animation: iOrn 1.2s cubic-bezier(.2,.8,.2,1) 2.9s forwards;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='14' viewBox='0 0 28 14'><path d='M14 1.5 22 7 14 12.5 6 7z' fill='none' stroke='%23e9b949' stroke-width='1.2'/><path d='M14 4.6 17.2 7 14 9.4 10.8 7z' fill='%23d8453a'/><path d='M0 7h4M24 7h4' stroke='%23e9b949' stroke-width='1.2'/></svg>") repeat-x center; }
@keyframes iOrn { to { transform: none; opacity: .95; } }
.i-tag { margin-top: 14px; color: #c9d1e4; font-size: 16px; opacity: 0; animation: rise .9s ease-out 3.2s forwards; }
.i-skip { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 22px); text-align: center; color: rgba(201,209,228,.55); font-size: 13px; letter-spacing: 1px; opacity: 0; animation: fadeIn .8s ease-out 1.2s forwards; }
.tabs.rise { animation: tabsUp .6s cubic-bezier(.2,.9,.2,1) both; }
@keyframes tabsUp { from { opacity: 0; transform: translate(-50%, 90px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* светлячки и параллакс в шапке */
.fly { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #ffe9a8; box-shadow: 0 0 10px 3px rgba(var(--gold-rgb),.7); opacity: 0;
  animation: fly 7s ease-in-out infinite; pointer-events: none; }

      '<rect x="-2000" y="-460" width="4400" height="720" fill="url(#iSky)"/>';
    var stars = document.createElementNS(NS, "g");
    for (var n = 0; n < 150; n++) {
      var c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", (-300 + Math.random() * 1000).toFixed(1)); c.setAttribute("cy", (-450 + Math.random() * 520).toFixed(1));
      c.setAttribute("r", (0.5 + Math.random() * 1.1).toFixed(2)); c.setAttribute("fill", "#fff");
      if (n % 4 === 0) { c.setAttribute("class", "i-star"); c.style.animationDelay = (Math.random() * 2.4).toFixed(2) + "s"; } else c.setAttribute("opacity", (0.35 + Math.random() * 0.6).toFixed(2));
      stars.appendChild(c);
    }
    var glint = document.createElementNS(NS, "g");  // вспышка ровно на вершине (172, 64)
    glint.setAttribute("transform", "translate(172,64)");
    glint.innerHTML = '<defs><radialGradient id="iGl"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#fff3c9" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>' +
      '<g class="i-glint"><circle r="13" fill="url(#iGl)"/><path d="M0,-15 Q1.4,-1.4 15,0 Q1.4,1.4 0,15 Q-1.4,1.4 -15,0 Q-1.4,-1.4 0,-15Z" fill="#fff"/></g>';
    if (wide) {  // на широком экране горы растворяются по краям
      var defs = document.createElementNS(NS, "defs");
      defs.innerHTML = '<linearGradient id="iFadeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".22" stop-color="#fff"/><stop offset=".78" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>' +
        '<mask id="iFade" maskUnits="userSpaceOnUse" x="-10" y="-100" width="420" height="400"><rect x="-10" y="-100" width="420" height="400" fill="url(#iFadeG)"/></mask>';
      svgEl.insertBefore(defs, svgEl.firstChild);
      var grp = document.createElementNS(NS, "g"); grp.setAttribute("mask", "url(#iFade)");
      svgEl.insertBefore(grp, k[3]);
      for (var q = 3; q <= 11; q++) if (k[q]) grp.appendChild(k[q]);
    }
    svgEl.insertBefore(stars, k[1]); svgEl.insertBefore(sky, stars); svgEl.appendChild(glint);

    var letters = "Ossetian VPN".split(""), brand = el("div", { class: "i-brand" });
    letters.forEach(function (ch, idx) {
      var sp = el("span", { class: idx > 8 ? "gold" : "", text: ch === " " ? "\u00a0" : ch });
      sp.style.animationDelay = (1.9 + idx * 0.07).toFixed(2) + "s"; brand.appendChild(sp);
    });
    var box = el("div", { class: "intro", id: "intro" },
      el("div", { class: "aurora a1" }), el("div", { class: "aurora a2" }), svgEl,
      el("div", { class: "i-title" }, el("div", { class: "i-eyebrow", text: "Ирыстон" }), brand, el("div", { class: "i-orn" }),
        el("div", { class: "i-tag", text: "Свободный интернет из сердца гор" })),
      el("div", { class: "i-skip", text: "НАЖМИ, ЧТОБЫ ПРОПУСТИТЬ" }));
    document.body.appendChild(box);

    var done = false;
    function finish() {
      if (done) return; done = true;
      box.classList.add("out");
      setTimeout(function () {  // интерфейс появляется под тающей заставкой
        document.body.classList.remove("introing");
        var v = document.getElementById("app"); var view = v && v.querySelector(".view");
        if (view) { view.classList.remove("enter"); void view.offsetWidth; view.classList.add("enter"); }
        var nav = document.getElementById("tabs"); if (nav) { nav.classList.remove("rise"); void nav.offsetWidth; nav.classList.add("rise"); }
      }, 160);
      setTimeout(function () { box.remove(); }, 760);
    }
    var t0 = Date.now();
    box.addEventListener("click", function () { if (Date.now() - t0 > 700) finish(); });
    setTimeout(finish, 5200);
  }

  /* параллакс шапки при прокрутке */
  (function () {
    var raf = 0;
    window.addEventListener("scroll", function () {
      if (raf) return;
      raf = requestAnimationFrame(function () {
        raf = 0; var sc = document.querySelector(".banner svg.scene");
        if (sc) sc.style.transform = "translateY(" + (Math.min(window.scrollY, 240) * 0.32).toFixed(1) + "px) scale(" + (1 + Math.min(window.scrollY, 240) * 0.0006).toFixed(3) + ")";
      });
    }, { passive: true });
  })();

  if (shouldIntro()) playIntro();
  refresh();
})();
</script>
